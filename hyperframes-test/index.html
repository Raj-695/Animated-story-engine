</style></head><body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10"><div class="stars"></div><div class="moon"></div><div class="ground"></div><div class="robot" id="robot"><div class="head"><div class="face"><i class="eye"></i><i class="eye"></i></div></div><div class="body"><div class="heart"></div></div><div class="arm left" id="armL"></div><div class="arm right" id="armR"></div><div class="leg l"></div><div class="leg r"></div></div><div class="lantern" id="lantern"><div class="glow"></div><div class="core"></div></div><div class="caption" id="caption">Even the smallest light can guide someone home.</div></div><script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.fromTo("#robot",{x:0,y:0},{x:390,y:-12,duration:3.2,ease:"power1.inOut"},.5);tl.to("#armR",{rotation:-78,duration:.45,ease:"power2.out"},3);tl.to("#armR",{rotation:-18,duration:.45,ease:"power2.inOut"},3.5);tl.to("#lantern",{opacity:1,scale:1.15,duration:1.1,ease:"power2.out"},4.1);tl.fromTo("#lantern .core",{scale:.35,opacity:.2},{scale:1,opacity:1,duration:.8,ease:"back.out(2)"},4.2);tl.to("#robot",{rotation:-4,duration:.3,yoyo:true,repeat:1,ease:"sine.inOut"},5.4);tl.to("#caption",{opacity:1,y:-10,duration:1,ease:"power2.out"},7.6);tl.to("#caption",{opacity:0,duration:.45},9.45);window.__timelines.main=tl;</script></body></html>
